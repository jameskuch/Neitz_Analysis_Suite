[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neitz"
version = "0.1.0"
description = "Neitz-lab electrophysiology analysis backbone (ABF I/O, spike detection, reverse correlation, flicker analysis)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyabf",
    "matplotlib",
    "pandas",
    "openpyxl",
]

[project.optional-dependencies]
gui = ["dash", "plotly", "kaleido",   # kaleido: server-side Plotly -> PDF/SVG for the 4K Run-Analysis exports
       "diskcache", "multiprocess", "psutil"]   # background-callback manager (non-blocking Run Analysis)
dev = ["pytest"]

[project.scripts]
neitz = "neitz.cli:main"

[tool.setuptools.packages.find]
include = ["neitz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
